# -*- Python -*-
# Integration test suite config

import os
import sys

import lit.util

sys.path.insert(0, os.path.dirname(__file__))
import GTA3ScriptTest  # noqa: E402


def quote_path(path):
    return '"{}"'.format(path.replace("\\", "/"))


def helper(name):
    return quote_path(os.path.join(config.test_source_root, name))


def require_gta3sc():
    gta3sc = lit_config.params.get("gta3sc") or os.getenv("GTA3SC")
    if not gta3sc:
        lit_config.fatal(
            "gta3sc is not set; pass --param gta3sc=<path> or set the "
            "GTA3SC environment variable to the binary under test")
    return quote_path(gta3sc)


def require_filecheck():
    program = lit.util.which("filecheck", config.environment["PATH"])
    if not program:
        lit_config.fatal(
            "couldn't find 'filecheck' on PATH; install the PyPI filecheck "
            "package (e.g. uv tool install filecheck)")
    return quote_path(program)


# name: The name of this test suite.
config.name = "gta3sc"

# testFormat: The test format to use to interpret tests.
config.test_format = GTA3ScriptTest.GTA3ScriptTest(
    execute_external=sys.platform not in ["win32"])

# suffixes: A list of file extensions to treat as test files.
config.suffixes = [".sc", ".test"]

# excludes: A list of individual files to exclude.
config.excludes = ["Inputs"]

# test_source_root: The root path where tests are located.
config.test_source_root = os.path.dirname(__file__)
# CMake's lit.site.cfg sets test_exec_root to the build tree; standalone
# falls back to the source tree.
config.test_exec_root = getattr(config, "test_exec_root", None) \
    or config.test_source_root

# Evaluate binaries
python = quote_path(sys.executable)
gta3sc = require_gta3sc()
filecheck = require_filecheck()
gta3sc_filecheck_sh = helper("gta3sc-filecheck.sh")
gta3sc_verify_sh = helper("gta3sc-verify.sh")
verify_py = helper("verify-diagnostics.py")
checksum_sh = helper("checksum.sh")
not_sh = helper("not.sh")

# Define substitutions
# Substitutions are used to replace the placeholders in the test files with the actual values.
#
# Longer names first: lit substitutes in list order, so `%gta3sc` must not precede `%gta3sc-filecheck`.
config.substitutions.extend([
    ("%gta3sc-filecheck", f"sh {gta3sc_filecheck_sh} {filecheck} {gta3sc}"),
    ("%gta3sc-verify", f"sh {gta3sc_verify_sh} {verify_py} {gta3sc}"),
    ("%gta3sc", f"{gta3sc} -Wno-expect-var"),
    ("%checksum", f"sh {checksum_sh}"),
    ("%verify", f"{python} {verify_py}"),
    ("%not", f"sh {not_sh}"),
    ("%FileCheck", filecheck),
])
